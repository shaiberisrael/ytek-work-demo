<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ytek Work — рабочий день</title>
<style>
:root{--blue:#306db2;--navy:#142a44;--ink:#23364d;--muted:#778496;--line:#e4eaf1;--bg:#f4f7fb;--green:#24755a;--amber:#a46616}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:3px solid #7cacf0;outline-offset:3px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:white;border-right:1px solid var(--line);padding:26px 22px;display:flex;flex-direction:column;gap:30px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:9px;height:65px}.brand img{width:117px;height:65px;object-fit:contain}.brand b{color:var(--blue);border-left:1px solid var(--line);padding-left:12px;font-size:20px}.nav{display:grid;gap:8px}.nav button{text-align:left;padding:13px 16px;border-radius:12px;background:transparent;color:var(--muted);font-weight:600}.nav button.active{background:#eaf1fb;color:var(--blue)}.nav small{display:block;padding:15px 16px 2px;font-size:10px;letter-spacing:1.7px}.demo{margin-top:auto;background:var(--bg);border-radius:14px;padding:14px;font-size:12px;color:var(--muted)}.demo strong{display:block;color:var(--ink);margin-bottom:5px}.main{min-width:0}header{height:84px;background:#ffffffb8;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 40px;gap:12px}.breadcrumb{color:var(--muted);font-size:13px}.role{display:flex;padding:4px;background:#edf1f6;border-radius:10px}.role button{padding:8px 14px;border-radius:7px;background:transparent;color:var(--muted);font-size:13px}.role button.active{background:white;box-shadow:0 2px 6px #142a4410;color:var(--ink)}.avatar{width:38px;height:38px;display:grid;place-items:center;background:#dce8f8;color:var(--blue);border-radius:50%;font-size:12px;font-weight:700}.header-right{display:flex;align-items:center;gap:18px}main{max-width:1440px;margin:auto;padding:34px 40px}.eyebrow{color:var(--blue);text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1.7px}h1{font-size:30px;letter-spacing:-.8px;margin:7px 0}h2{font-size:18px;margin:0 0 16px;letter-spacing:-.3px}h3{font-size:16px;margin:0 0 6px}p{margin:5px 0 16px}.muted{color:var(--muted);font-size:13px}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 4px 18px #142a4403;margin-bottom:22px}.dark{background:var(--navy);border-color:var(--navy);color:white;position:relative;overflow:hidden}.dark .muted{color:#b3c2d4}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:600;background:#edf3fb;color:var(--blue)}.badge.green{background:#e7f4ed;color:var(--green)}.badge.amber{background:#fff2de;color:var(--amber)}.badge.red{background:#ffe9e8;color:#b24c48}.dark .badge{background:#ffffff14;color:#cfdfed}.clock{font-size:47px;font-weight:600;letter-spacing:-2px;margin:17px 0 8px;font-variant-numeric:tabular-nums}.btn{padding:11px 17px;border-radius:10px;background:var(--blue);color:white;font-weight:600;font-size:13px}.btn.secondary{background:#eef3fa;color:var(--blue)}.btn.light{background:white;color:var(--navy)}.btn.danger{background:#fff0ee;color:#ad4c40}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.divider{height:1px;background:var(--line);margin:20px 0}.dark .divider{background:#ffffff1b}.plate{font:700 17px/1.5 monospace;background:#ffdf74;color:#343323;letter-spacing:1px;padding:3px 10px;border-radius:6px;display:inline-block}.car-art{height:98px;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#f2f6fb,#eaf1fb);border-radius:12px;margin:16px 0}.car-art svg{width:225px;height:85px}.metric{font-size:23px;font-weight:600;letter-spacing:-.5px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.metrics .card{padding:18px;margin:0}.task{border-left:3px solid #84a9d8;padding-left:16px}.task p{margin:4px 0}.avatars{display:flex;gap:6px;margin-top:14px}.person{font-size:11px;background:#f0f4f9;border-radius:20px;padding:6px 10px}.mini{border-bottom:1px solid var(--line);padding:13px 0}.mini:last-child{border:0}.link{color:var(--blue);text-decoration:none;font-size:13px}.assignment{display:grid;grid-template-columns:1.2fr 1.4fr 1fr 1fr auto;align-items:center;gap:18px;border-top:1px solid var(--line);padding:18px 0}.assignment:first-of-type{border:0}.assignment .muted{margin-top:4px}.pill{display:inline-block;background:#eef3f8;padding:5px 10px;font-size:12px;border-radius:7px}.fleet{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.fleet .card{margin:0}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.footnote{font-size:11px;color:var(--muted);margin-top:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:13px 22px;border-radius:12px;box-shadow:0 8px 30px #142a4430;z-index:9;max-width:90vw}.toast:empty{display:none}dialog{border:0;border-radius:20px;padding:28px;width:min(520px,calc(100vw - 28px));box-shadow:0 24px 100px #142a4444;color:var(--ink)}dialog::backdrop{background:#10203377;backdrop-filter:blur(3px)}label{display:block;font-size:12px;font-weight:600;margin:15px 0 6px}input,select,textarea{width:100%;padding:10px 12px;background:#f8fafc;border:1px solid #dce4ed;border-radius:9px;color:var(--ink)}textarea{min-height:80px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}.error{color:#b14040;font-size:13px;margin-top:12px}.check{display:flex;align-items:center;gap:10px}.check input{width:auto}.attachment{display:block;max-width:100%;max-height:190px;object-fit:contain;margin:10px 0;border-radius:8px}.icon{font-size:18px;margin-right:9px}.reset{color:var(--muted);background:transparent;font-size:11px;padding:10px 0;text-decoration:underline}.viewing{background:#fff4dc;color:#835c20;padding:10px 16px;border-radius:10px;margin-bottom:20px;font-size:12px}.mobile-brand{display:none}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:1100px){aside{width:195px;padding:20px 16px}.shell{grid-template-columns:195px 1fr}main{padding:25px}header{padding:0 25px}.grid{grid-template-columns:1fr}.assignment{grid-template-columns:1fr 1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{display:block}aside{position:static;width:100%;height:auto;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{height:44px}.brand img{height:44px;width:87px}.nav{display:flex;overflow:auto;gap:4px}.nav small,.demo{display:none}.nav button{white-space:nowrap;padding:9px 12px;font-size:12px}header{height:65px;padding:0 16px}.breadcrumb{display:none}.header-right{width:100%;justify-content:space-between}main{padding:22px 16px}h1{font-size:26px}.titlebar{align-items:flex-start}.card{padding:19px;border-radius:15px}.grid{gap:0}.metrics{gap:10px}.metrics .metric{font-size:21px}.assignment{grid-template-columns:1fr 1fr;gap:12px}.assignment button{grid-column:2}.fleet{grid-template-columns:1fr}.clock{font-size:43px}.titlebar>.muted{font-size:11px;text-align:right}.role button{padding:7px 12px}.formrow{grid-template-columns:1fr}.actions .btn{flex-grow:1}.row{flex-wrap:wrap}}
</style></head>
<body><div class="shell"><aside><div class="brand"><img src="ytek-original.png" alt="Ytek"><b>Work</b></div><nav id="nav" class="nav" aria-label="Разделы"></nav><div class="demo"><strong>Интерактивный прототип</strong>Вымышленные сотрудники и объекты. Данные живут только до перезагрузки страницы.<br><button class="reset" onclick="location.reload()">Начать демонстрацию заново</button></div></aside><div class="main"><header><div class="breadcrumb">Ytek / Рабочее пространство</div><div class="header-right"><div class="role" aria-label="Демонстрация роли"><button id="employeeRole" onclick="setRole('employee')">Сотрудник</button><button id="managerRole" onclick="setRole('manager')">Менеджер</button></div><div class="avatar" id="avatar">АК</div></div></header><main id="app"></main></div></div><dialog id="dialog"><form id="form"><div class="row"><h2 id="dialogTitle"></h2><button type="button" class="btn secondary" onclick="closeDialog()" aria-label="Закрыть">×</button></div><div id="fields"></div><div id="error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Сохранить</button><button class="btn secondary" type="button" onclick="closeDialog()">Отмена</button></div></form></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<link rel="stylesheet" href="appearance.css"><link rel="stylesheet" href="vehicle-photos.css"><link rel="stylesheet" href="logo.css"><link rel="stylesheet" href="responsive.css"><script src="appearance.js" defer></script><script src="translations.js" defer></script><script src="i18n.js" defer></script><script src="accounts.js" defer></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=['Алексей Козлов','Даниэль Леви','Михаил Орлов','Давид Коэн'];
const cars=[{id:1,name:'Renault Trafic',plate:'482-63-701',km:84320},{id:2,name:'Renault Kangoo',plate:'619-24-502',km:61750},{id:3,name:'Citroën Berlingo',plate:'735-18-403',km:102480},{id:4,name:'Subaru Forester',plate:'294-57-604',km:78910}];
const sites=['Школа «Галиль», Нагария','Учебный центр, Акко','Школа «Орен», Хайфа','Школа «Римон», Кармиэль'];
let role='employee',view='today',user=people[0],gps=true,shift=null,shifts=[],sessions=[],fuel=[],issues=[],reports=[],requests=[],taskStatus='Назначено',notices=[],modalSave=null;
let assignments=cars.map((c,i)=>({id:i+1,car:c.id,driver:people[i],team:'Бригада '+(i+1),site:sites[i],start:'06:00',end:'18:00'}));
const car=id=>cars.find(c=>c.id===Number(id));const active=id=>sessions.find(s=>s.car===id&&!s.end);const own=()=>sessions.find(s=>s.driver===user&&!s.end);const planned=()=>{let handoff=[...sessions].reverse().find(s=>s.end&&s.next===user&&!s.claimed);return handoff?{car:handoff.car,team:'Передача автомобиля',site:assignments.find(a=>a.driver===user)?.site||sites[0],handoff}:assignments.find(a=>a.driver===user)};const time=()=>new Date().toLocaleTimeString((window.YtekI18n?.locale||'ru-RU'),{hour:'2-digit',minute:'2-digit'});const km=n=>Number(n).toLocaleString((window.YtekI18n?.locale||'ru-RU'));
const btn=(text,action,kind='secondary')=>`<button class="btn ${kind}" onclick="${action}">${text}</button>`;
function toast(t){$('#toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
function setRole(r){role=r;view=r==='employee'?'today':'board';render()}
function setView(v){view=v;render()}
const art=`<div class="car-art"><svg viewBox="0 0 280 100" aria-hidden="true"><path d="M35 62V30q0-8 9-8h143l43 25h17q10 0 10 12v19H27V65z" fill="#c4d5ea"/><path d="M150 29h34l31 21h-65z" fill="#5d80aa"/><rect x="48" y="29" width="42" height="23" rx="3" fill="#5d80aa"/><rect x="97" y="29" width="42" height="23" rx="3" fill="#5d80aa"/><path d="M26 77h233" stroke="#306db2" stroke-width="5"/><circle cx="69" cy="78" r="15" fill="#23364d"/><circle cx="69" cy="78" r="7" fill="#dce6f0"/><circle cx="213" cy="78" r="15" fill="#23364d"/><circle cx="213" cy="78" r="7" fill="#dce6f0"/><path d="M146 29v43" stroke="#9bb4d2" stroke-width="2"/><rect x="239" y="55" width="15" height="8" rx="2" fill="#fff5d4"/></svg></div>`;
function render(){const nav=role==='employee'?[['today','◷','Сегодня'],['vehicle','▱','Мой автомобиль'],['hours','≡','Мои часы'],['requests','↗','Заявки'],['profile','○','Профиль']]:[['board','▦','Обзор дня'],['fleet','▱','Автомобили'],['service','⚒','Обслуживание'],['requests','↗','Заявки команды']];$('#nav').innerHTML='<small>РАБОЧЕЕ ПРОСТРАНСТВО</small>'+nav.map(([v,i,t])=>`<button class="${v===view?'active':''}" onclick="setView('${v}')"><span class="icon">${i}</span>${t}</button>`).join('');$('#employeeRole').className=role==='employee'?'active':'';$('#managerRole').className=role==='manager'?'active':'';$('#avatar').textContent=role==='manager'?'МН':user.split(' ').map(n=>n[0]).join('');const names={today:'Хорошего рабочего дня',vehicle:'Мой автомобиль',hours:'Мои часы',requests:role==='manager'?'Заявки команды':'Мои заявки',profile:'Мой профиль',board:'Команда в движении',fleet:'Автомобили',service:'Обслуживание'};$('#app').innerHTML=`<div class="titlebar"><div><div class="eyebrow">${role==='manager'?'Панель менеджера':esc(user)}</div><h1>${names[view]}</h1><div class="muted">${role==='manager'?'Люди, объекты и транспорт — в одном месте':'Всё необходимое для работы сегодня'}</div></div><div class="muted">Демонстрационный день<br><span translate="no" data-today-date></span></div></div>`+({today:today,vehicle:vehicle,hours:hours,requests:requestView,profile:profile,board:board,fleet:fleetView,service:serviceView}[view])()+`<div class="footnote">Демо • Действия не отправляются в Ytek. GPS и уведомления имитируются.</div>`;}
function vehicleCard(){let s=own(),a=planned(),c=s?car(s.car):a?car(a.car):null;if(!c)return '<div class="card"><h2>Мой автомобиль</h2><p class="muted">Ожидается назначение менеджера.</p></div>';let occupied=active(c.id),blocked=issues.some(i=>i.car===c.id&&i.unsafe&&i.status!=='Выполнено');return `<div class="card"><div class="row"><h2>Мой автомобиль</h2><span class="badge ${blocked?'red':s?'green':''}">${blocked?'Требует проверки':s?'Принят вами':'Назначен'}</span></div><div class="row"><div><h3>${c.name}</h3><div class="muted">${esc(a?.team||'Назначение в течение дня')}</div></div><span class="plate">${c.plate}</span></div>${art}<div class="row"><div><div class="muted">${s?'При получении':'Последнее показание'}</div><div class="metric">${km(s?s.startKm:c.km)} <small>км</small></div></div><div class="muted">${s?'Получен в '+s.start:occupied?'Сейчас у '+esc(occupied.driver):'Готов к приёму'}</div></div><div class="actions">${s?btn('Передать / вернуть',"openForm('return')",''):btn('Принять автомобиль',"openForm('accept')",'')}${btn('Заправка',"openForm('fuel')")}${btn('Неисправность',"openForm('issue')")}</div>${blocked?'<p class="muted" style="margin-top:12px">Сообщено о небезопасном состоянии. Приём заблокирован до проверки.</p>':''}</div>`}
function today(){const a=planned();return `<div class="grid"><div><div class="card dark"><div class="row"><h2>Рабочий день</h2><span class="badge">${shift?'● День начат':'○ Не начат'}</span></div><div class="clock">${shift?shift:'— : —'}</div><p class="muted">${shift?'Время начала сохранено':'Отметьте начало, когда приступаете к работе'}</p>${btn(shift?'Закончить рабочий день':'Начать рабочий день','toggleShift()','light')}<div class="divider"></div><div class="row"><span class="muted">${gps?'⌖ GPS при отметке · демо':'GPS отключён менеджером'}</span><span class="muted">Независимо от автомобиля</span></div></div><div class="card"><div class="row"><h2>Назначение на сегодня</h2><span class="badge">${taskStatus}</span></div><div class="task"><h3>${esc(a?.site||'Ожидается назначение')}</h3><p>Ремонт помещения: подготовка стен и установка светильников.</p><p class="muted">Контакт и точный адрес появятся в рабочей версии</p><div class="avatars"><span class="person">${esc(a?.team||'Бригада')}</span><span class="person">Менеджер: Наталья</span></div></div><div class="actions">${btn('Приступить',"startTask()")}${btn('Фотоотчёт',"openForm('report')",'')}${btn('Нужна помощь',"openForm('help')")}</div></div></div><div>${vehicleCard()}<div class="card"><h2>Входящие</h2>${notices.length?notices.slice(-4).reverse().map(n=>`<div class="mini">${esc(n)}</div>`).join(''):'<div class="mini"><span class="badge">Назначение</span><p style="margin-top:9px">План дня и автомобиль доступны. Подтвердите получение машины перед выездом.</p></div>'}</div></div></div>`}
function vehicle(){return `<div class="grid"><div>${vehicleCard()}<div class="card"><h2>Передачи автомобиля</h2>${sessions.length?sessions.map(s=>`<div class="mini"><div class="row"><b>${car(s.car).plate}</b><span class="badge ${s.end?'':'green'}">${s.end?'Возвращён':'В использовании'}</span></div><div><span translate="no">${esc(s.driver)}</span> · ${s.start} — ${s.end||'…'}</div><div class="muted">${km(s.startKm)} → ${s.end?km(s.endKm):'…'} км ${s.end?'· '+km(s.endKm-s.startKm)+' км':''}</div></div>`).join(''):'<p class="muted">Передач пока нет. Начните с приёма автомобиля.</p>'}</div></div><div><div class="card"><h2>Заправки</h2>${fuel.length?fuel.map(f=>`<div class="mini"><b>${car(f.car).plate} · ${f.liters} л</b><div>${f.sum} ₪ · ${km(f.km)} км</div><div class="muted"><span translate="no">${esc(f.driver)}</span> · ${f.at}</div>${f.receipt?'<span class="badge">Чек прикреплён</span>':''}</div>`).join(''):'<p class="muted">Сохранённые заправки появятся здесь.</p>'}</div>${issueCards(false)}</div></div>`}
function hours(){return `<div class="card"><h2>Мой табель</h2>${shift?`<div class="mini">Сегодня · ${shift} — <span class="badge green">Работаю</span></div>`:''}${shifts.length?shifts.map(s=>`<div class="mini"><div class="row"><b>Сегодня</b><span>${s.start} — ${s.end}</span></div><span class="muted">${s.gps?'Геопроверка: в зоне (демо)':'Без геопроверки'}</span></div>`).join(''):!shift?'<p class="muted">Отметок пока нет. Начните день на главном экране.</p>':''}<div class="actions">${btn('Запросить исправление',"openForm('correction')")}</div></div>`}
function profile(){return `<div class="card"><h2><span translate="no">${esc(user)}</span></h2><p>Выездной сотрудник · Ремонтная бригада</p><span class="badge">Роль: сотрудник</span><label>Посмотреть сценарий другого водителя (демо)</label><select onchange="user=this.value;render()">${people.map(p=>`<option ${p===user?'selected':''}>${p}</option>`).join('')}</select><div class="divider"></div><h3>Рабочие документы</h3><p class="muted">В демонстрации нет персональных документов.</p><h3>Язык интерфейса</h3><p class="muted">Выберите язык в верхней части экрана.</p></div>`}
function requestView(){let list=role==='manager'?requests:requests.filter(r=>r.driver===user);return `<div class="card"><div class="row"><h2>${role==='manager'?'На согласовании':'Отпуска и отсутствия'}</h2>${role==='employee'?btn('Новая заявка',"openForm('leave')",''):''}</div>${list.length?list.map(r=>`<div class="mini"><div class="row"><b>${esc(r.type)}</b><span class="badge">${esc(r.status)}</span></div><div><span translate="no">${esc(r.driver)}</span> · <span translate="no">${esc(r.details)}</span></div>${role==='manager'&&r.status==='На рассмотрении'?`<div class="actions">${btn('Одобрить',`decide(${r.id},'Одобрено')`)}${btn('Отклонить',`decide(${r.id},'Отклонено')`,'danger')}</div>`:''}</div>`).join(''):'<div class="empty">Новых заявок пока нет</div>'}</div>`}
function board(){return `<div class="metrics">${[['Бригад на сегодня',4],['Автомобилей в работе',sessions.filter(s=>!s.end).length],['На обслуживании',cars.filter(c=>issues.some(i=>i.car===c.id&&i.unsafe&&i.status!=='Выполнено')).length],['Новых заявок',issues.filter(i=>i.status==='Новая').length]].map(([t,n])=>`<div class="card"><div class="muted">${t}</div><div class="metric">${n}</div></div>`).join('')}</div><div class="card"><div class="row"><h2>План выездов</h2>${btn('+ Назначить автомобиль',"openForm('assign')",'')}</div><p class="muted">Плановое время назначения и фактический приём учитываются отдельно.</p>${assignments.map(a=>`<div class="assignment"><div><span class="plate">${car(a.car).plate}</span><div class="muted">${car(a.car).name}</div></div><div><b><span translate="no">${esc(a.team)}</span></b><div class="muted"><span translate="no">${esc(a.driver)}</span></div></div><div>${esc(a.site)}<div class="muted">${a.start} — ${a.end}</div></div><div><span class="badge ${active(a.car)?'green':''}">${active(a.car)?'У водителя':'Запланирован'}</span></div>${btn('Изменить',`openForm('assign',${a.id})`)}</div>`).join('')}</div><div class="grid"><div class="card"><h2>Фотоотчёты и помощь</h2>${reports.length?reports.map(r=>`<div class="mini"><b><span translate="no">${esc(r.driver)}</span> · ${esc(r.type)}</b><p><span translate="no">${esc(r.text)}</span></p>${r.photo?`<img class="attachment" src="${r.photo}" alt="Фотоотчёт">`:''}<span class="badge">${r.status}</span>${r.type==='Фотоотчёт'&&r.status==='На проверке'?`<div class="actions">${btn('Принять',`reviewReport(${r.id},true)`)}${btn('На доработку',`reviewReport(${r.id},false)`)}</div>`:''}</div>`).join(''):'<p class="muted">Отчёты работников появятся здесь.</p>'}</div><div class="card"><h2>Геопроверка рабочего времени</h2><p class="muted">При сбоях GPS можно отключить сбор для всей компании. Рабочее время продолжит фиксироваться.</p><span class="badge ${gps?'green':'amber'}">${gps?'Сбор GPS включён':'Сбор GPS отключён'}</span><div class="actions">${btn(gps?'Отключить GPS':'Включить GPS','gps=!gps;render();toast("Настройка GPS изменена")')}</div></div></div>`}
function fleetView(){return `<div class="fleet">${cars.map(c=>`<div class="card"><div class="row"><h2>${c.name}</h2><span class="plate">${c.plate}</span></div>${art}<div class="metric">${km(c.km)} км</div><p class="muted">${active(c.id)?'За рулём: '+esc(active(c.id).driver):'Сейчас не принят водителем'}</p><span class="badge ${issues.some(i=>i.car===c.id&&i.unsafe&&i.status!=='Выполнено')?'red':''}">${issues.some(i=>i.car===c.id&&i.unsafe&&i.status!=='Выполнено')?'Требует проверки':'Доступен для назначений'}</span><div class="actions">${btn('Назначить',`openForm('assign',0,${c.id})`)}</div></div>`).join('')}</div>`}
function issueCards(manager){let list=manager?issues:issues.filter(i=>i.driver===user);return `<div class="card"><h2>Заявки на обслуживание</h2>${list.length?list.map(i=>`<div class="mini"><div class="row"><b>${car(i.car).plate}</b><span class="badge ${i.unsafe?'red':'amber'}">${i.unsafe?'Небезопасно':'Обычная'}</span></div><p><span translate="no">${esc(i.text)}</span></p><div class="muted"><span translate="no">${esc(i.driver)}</span> · ${km(i.km)} км</div>${i.photo?`<img class="attachment" src="${i.photo}" alt="Неисправность">`:''}${manager?`<label>Статус заявки</label><select onchange="changeIssue(${i.id},this.value)">${['Новая','Рассмотрена','Запланировано обслуживание','Выполнено'].map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="badge">${i.status}</span>`}</div>`).join(''):'<p class="muted">Заявок пока нет.</p>'}</div>`}
function serviceView(){return issueCards(true)}
function toggleShift(){if(!shift){shift=time();toast('Начало рабочего дня сохранено'+(gps?' · GPS: в зоне (демо)':''))}else{shifts.push({start:shift,end:time(),gps});shift=null;toast('Окончание дня сохранено. Возврат автомобиля оформляется отдельно.')}render()}
function startTask(){taskStatus='В работе';render();toast('Задание начато')}
function decide(id,status){requests.find(r=>r.id===id).status=status;notices.push('Решение по заявке: '+status);render()}
function reviewReport(id,ok){let r=reports.find(r=>r.id===id);r.status=ok?'Принято':'Нужна доработка';taskStatus=r.status;notices.push('Фотоотчёт: '+r.status);render()}
function changeIssue(id,status){issues.find(i=>i.id===id).status=status;notices.push('Обслуживание: '+status);render();toast('Статус обновлён')}
function closeDialog(){$('#dialog').close()}
function input(name,title,type='text',value='',extra=''){return `<label for="f-${name}">${title}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}
function select(name,title,opts,value){return `<label for="f-${name}">${title}</label><select id="f-${name}" name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select>`}
function note(){return '<label for="f-text">Комментарий</label><textarea id="f-text" name="text" required placeholder="Опишите, что произошло или что нужно сделать"></textarea>'}
function attachment(title){return input('photo',title,'file','','accept="image/*"')+'<div class="muted">До 5 МБ. Только для текущей демонстрации.</div>'}
function openForm(type,id=0,carId=0){let s=own(),a=planned(),c=s?car(s.car):a?car(a.car):cars[0];let fields='',title='';if(type==='accept'){if(s)return toast('Сначала верните текущий автомобиль');if(!a)return toast('Сначала требуется назначение менеджера');if(active(c.id))return toast('Автомобиль ещё не возвращён предыдущим водителем');if(issues.some(i=>i.car===c.id&&i.unsafe&&i.status!=='Выполнено'))return toast('Приём заблокирован: автомобиль требует проверки');title='Принять '+c.plate;fields=`<p class="muted">${c.name}. Сверьте показание с одометром.</p>`+input('km','Пробег, км','number',c.km,'required min="0" step="1"')+input('reason','Если показание отличается — объясните причину');}
if(type==='return'){if(!s)return toast('Нет принятого автомобиля');title='Передать / вернуть '+c.plate;fields=input('km','Показание одометра при передаче, км','number',c.km,`required min="${s.startKm}" step="1"`)+select('next','Следующий водитель',[['','Возврат на базу'],...people.filter(p=>p!==user).map(p=>[p,p])],'')+input('remark','Замечания при передаче');}
if(type==='fuel'){if(!s)return toast('Для заправки сначала примите автомобиль');title='Заправка · '+c.plate;fields='<div class="formrow">'+input('liters','Литры','number','','required min="0.1" step="0.01"')+input('sum','Общая сумма, ₪','number','','required min="0.01" step="0.01"')+'</div>'+input('km','Показание одометра, км','number',c.km,`required min="${c.km}" step="1"`)+attachment('Фото чека');}
if(type==='issue'){title='Заявка на обслуживание';fields=select('car','Автомобиль',cars.map(c=>[c.id,c.name+' · '+c.plate]),c.id)+input('km','Показание одометра, км','number',c.km,'required min="0" step="1"')+note()+'<label class="check"><input type="checkbox" name="unsafe">Продолжать движение небезопасно</label>'+attachment('Фото проблемы');}
if(type==='assign'){let old=assignments.find(x=>x.id===id);title=id?'Изменить назначение':'Назначить автомобиль';fields=select('car','Автомобиль',cars.map(c=>[c.id,c.name+' · '+c.plate]),old?.car||carId||1)+select('driver','Ответственный водитель',people.map(p=>[p,p]),old?.driver||people[0])+input('team','Бригада','text',old?.team||'Бригада 1','required')+select('site','Объект',sites.map(p=>[p,p]),old?.site||sites[0])+'<div class="formrow">'+input('start','С','time',old?.start||'06:00','required')+input('end','До','time',old?.end||'18:00','required')+'</div><p class="muted">Назначение на демонстрационный день. Для смены машины сначала завершите предыдущий интервал.</p>';}
if(type==='report'||type==='help'){title=type==='report'?'Фотоотчёт по заданию':'Сообщить о проблеме';fields=note()+(type==='report'?attachment('Фотография выполненной работы'):'');}
if(type==='leave'){title='Заявка на отсутствие';fields=select('type','Тип',[['Отпуск','Отпуск'],['Больничный','Больничный']],'Отпуск')+'<div class="formrow">'+input('from','С','date','','required')+input('to','По','date','','required')+'</div>'+input('comment','Комментарий');}
if(type==='correction'){title='Исправление рабочего времени';fields=input('date','Дата','date','','required')+'<div class="formrow">'+input('start','Начало','time','','required')+input('end','Окончание','time','','required')+'</div>'+note();}
$('#dialogTitle').textContent=title;$('#fields').innerHTML=fields;$('#error').textContent='';modalSave=async f=>{let n=Number(f.get('km'));let photo=$('#form input[type=file]')?.files[0];if(photo&&(!photo.type.startsWith('image/')||photo.size>5*1024*1024))throw Error('Прикрепите изображение размером до 5 МБ');let url=photo?URL.createObjectURL(photo):null;
if(type==='accept'){if(n<c.km)throw Error('Пробег не может быть меньше последнего показания');if(n!==c.km&&!f.get('reason').trim())throw Error('Укажите причину расхождения показаний');sessions.filter(h=>h.end&&h.car===c.id&&!h.claimed).forEach(h=>h.claimed=true);sessions.push({car:c.id,driver:user,start:time(),startKm:n,reason:f.get('reason')});c.km=n;}
if(type==='return'){if(n<c.km)throw Error('Пробег не может быть меньше последнего показания, включая заправки');Object.assign(s,{end:time(),endKm:n,next:f.get('next'),remark:f.get('remark')});c.km=n;let next=f.get('next');if(next)notices.push('Автомобиль '+c.plate+' передан. '+next+' должен подтвердить приём.');}
if(type==='fuel'){c.km=n;fuel.push({car:c.id,driver:user,km:n,liters:Number(f.get('liters')),sum:Number(f.get('sum')),receipt:url,at:time()});}
if(type==='issue'){issues.push({id:Date.now(),car:Number(f.get('car')),driver:user,km:n,text:f.get('text'),unsafe:f.has('unsafe'),photo:url,status:'Новая'});notices.push('Заявка на обслуживание отправлена менеджеру');}
if(type==='assign'){let obj={id:id||Date.now(),car:Number(f.get('car')),driver:f.get('driver'),team:f.get('team'),site:f.get('site'),start:f.get('start'),end:f.get('end')};if(obj.end<=obj.start)throw Error('В этом прототипе окончание должно быть позже начала в тот же день');if(issues.some(i=>i.car===obj.car&&i.unsafe&&i.status!=='Выполнено'))throw Error('Автомобиль требует проверки и не может быть назначен');if(assignments.some(x=>x.id!==id&&(x.car===obj.car||x.driver===obj.driver)&&obj.start<x.end&&obj.end>x.start))throw Error('Пересечение: автомобиль или водитель уже назначен на это время');if(id)assignments=assignments.map(x=>x.id===id?obj:x);else assignments.push(obj);notices.push('Менеджер обновил план выездов');}
if(type==='report'||type==='help'){if(type==='report'&&!photo)throw Error('Добавьте фотографию выполненной работы');reports.push({id:Date.now(),type:type==='report'?'Фотоотчёт':'Нужна помощь',driver:user,text:f.get('text'),photo:url,status:type==='report'?'На проверке':'Новое'});if(type==='report')taskStatus='На проверке';}
if(type==='leave'){if(f.get('to')<f.get('from'))throw Error('Дата окончания должна быть не раньше начала');requests.push({id:Date.now(),driver:user,type:f.get('type'),details:f.get('from')+' — '+f.get('to')+' '+f.get('comment'),status:'На рассмотрении'});}
if(type==='correction')requests.push({id:Date.now(),driver:user,type:'Исправление времени',details:f.get('date')+' · '+f.get('start')+' — '+f.get('end')+' · '+f.get('text'),status:'На рассмотрении'});
};$('#dialog').showModal();}
$('#form').addEventListener('submit',async e=>{e.preventDefault();try{await modalSave(new FormData(e.target));closeDialog();render();toast('Сохранено в демонстрации')}catch(err){$('#error').textContent=err.message}});render();
</script></body></html>
